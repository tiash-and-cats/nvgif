<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/default.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<title>{{ page.title }} | NVGIF docs</title>
<style>
body {
  margin: 0;
  font-family: system-ui, Arial, Helvetica, sans-serif;
  color: #222222;
}

nav {
  overflow: hidden;
  position: fixed;
  background-color: #333;
  width: 100%;
  top: 0;
}

nav a {
  float: left;
  display: block;
  color: #f2f2f2;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
  font-size: 17px;
}

nav a:hover {
  background-color: #ddd;
  color: black;
}

nav .logo {
  font-weight: bold;
  font-family: Verdana;
  background-color: #CC00F3;
  color: white !important;
}

nav .logo:hover {
  background-color: #7C0094;
}

nav .icon {
  display: none;
}

@media screen and (max-width: 600px) {
  nav a:not(:first-child) {display: none;}
  nav .seperator {display: none;}
  nav a.icon {
    float: right;
    display: block;
  }
  .sidenav { display: none }
  article {
    margin-left: 0 !important;
  }
  footer {
    margin-left: 0 !important;
  }
}

a {color: dodgerBlue;}
a:hover {color: royalBlue;}

@media screen and (max-width: 600px) {
  nav.responsive .icon {
    position: absolute;
    right: 0;
    top: 0;
  }
  nav.responsive a {
    float: none;
    display: block;
    text-align: left;
  }
  nav.responsive a.text {display: none}
}

article code:not(pre > code) {
  padding: 4px;
  border-radius: 4px;
  background-color: #efefef;
}

blockquote {
  margin-left: 0;
  padding-left: 20px;
  border-left: 5px solid grey;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
  width: 100%;
  border: 1px solid #ddd;
}

th, td {
  text-align: left;
  padding: 8px;
}

tr:nth-child(even) {
  background-color: #fafafa;
}

article {
  padding-inline: 12vw;
  margin-top: 66px;
  margin-left: 20vw; /* Same as the width of the sidenav */
}

footer {
  padding-block: 12px;
  padding-inline: 12vw;
  margin-top: 12px;
  background-color: #555;
  color: #ccc;
  margin-left: 20px;
}

img, canvas {
  max-width: 100%;
}

.footnotes {
  font-size: .75em;
  counter-reset: item 1;
}

.footnotes li::marker {
  content: "[" counter(item) "] ";
}

.footnote-ref > a::before {
  content: "[";
}

.footnote-ref > a::after {
  content: "]";
}

h1, h2, h3, h4, h5, h6 {
  & > .permalink {
    color: #999999;
    font-size: 0.8em;
    padding: 0 4px;
    display: none;
  }
  &:hover > .permalink {
    display: inline;
  }
}

/* Fixed sidenav, full height */
.sidenav {
  height: 100%;
  width: 20vw;
  position: fixed;
  z-index: 1;
  top: 50px;
  left: 0;
  background-color: #111;
  overflow-x: hidden;
  padding-top: 20px;
}

/* Style the sidenav links and the dropdown button */
.sidenav a, .dropdown-btn, .sidenav h1 {
  padding: 6px 8px 6px 16px;
  text-decoration: none;
  color: #818181;
  display: block;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  cursor: pointer;
  outline: none;
  font-family: inherit;
  font-size: inherit;
}

.sidenav h1 {
  font-size: 20px;
  margin: 0 0 3px 0;
  color: #f1f1f1;
}

.dropdown-btn > a {
  text-decoration: none;
  padding: 0;
  display: inline;
  color: inherit;
}

.dropdown-btn > a:hover {
  text-decoration: underline;
}

/* On mouse-over */
.sidenav a:hover, .dropdown-btn:hover {
  color: #f1f1f1;
}

/* Add an active class to the active dropdown button */
.active {
  background-color: #7C0094;
  color: white;
}

.dropdown-container {
  display: none;
  background-color: #262626;
  padding-left: 8px;
}

/* Optional: Style the caret down icon */
.fa-caret-down {
  float: right;
  padding-right: 8px;
}

/* Some media queries for responsiveness */
@media screen and (max-height: 450px) {
  .sidenav {padding-top: 15px;}
  .sidenav a {font-size: 18px;}
}
</style>
</head>
<body>

<nav id="myTopnav">
  <a href="/nvgif/" class="logo">nvgif</a>
  <a href="/nvgif/specs/">Specification</a>
  <a href="/nvgif/implementations/">Implementations</a>
  <a href="javascript:void(0);" class="icon" onclick="openNav()">
    <i class="fa fa-bars"></i>
  </a>
</nav>

<aside class="sidenav" aria-label="Table of contents">
  <h1>Table of Contents</h1>
</aside>

<article>
{{ content }}
</article>

<footer role="contentinfo">
  <p><em id="quote"></em></p>
  <p>&copy; tiash-and-cats <span id="year"></span><br>
  <small>The NVGIF reference implementations and examples are licensed under the MIT License.</small></p>
</footer>

<script>
// Navigation
function openNav() {
  var x = document.getElementById("myTopnav");
  if (x.className === "") {
    x.className = "responsive";
  } else {
    x.className = "";
  }
}

// Syntax highlighting
document.querySelectorAll("div.highlighter-rouge:has(div.highlight > pre.highlight > code)").forEach(e => {
  const [langClass] = Array.from(e.classList).filter(x => x.startsWith("language-"));
  e.querySelector("div.highlight > pre.highlight").classList.add("hljs");
  e.querySelector("div.highlight > pre.highlight").classList.add(langClass);
});

hljs.highlightAll();

// Table of Contents
function buildTOCGraph(level, i, headings) {
  const g = { heading: headings[i].innerHTML, id: headings[i].id, childHeadings: [] };
  let j = i + 1;
  while (j < headings.length) {
    const e = headings[j];
    const eLevel = parseInt(e.tagName.replace("H",""));
    if (eLevel <= level) break; // stop when same or higher level
    g.childHeadings.push(buildTOCGraph(eLevel, j, headings));
    // skip past the subtree we just consumed
    while (j+1 < headings.length && parseInt(headings[j+1].tagName.replace("H","")) > eLevel) {
      j++;
    }
    j++;
  }
  return g;
}

function buildTOCView(g, e) {
  if (g.childHeadings.length === 0) {
    const a = document.createElement("a");
    a.href = `#${g.id}`;
    a.innerHTML = g.heading;
    e.appendChild(a);
  } else {
    const btn = document.createElement("button");
    btn.className = "dropdown-btn";
    const a = document.createElement("a");
    a.href = `#${g.id}`;
    a.innerHTML = g.heading;
    btn.appendChild(a);
    const i = document.createElement("i");
    i.className = "fa fa-caret-down";
    btn.appendChild(i);
    e.appendChild(btn);
    const drp = document.createElement("div");
    drp.className = "dropdown-container";
    for (let subG of g.childHeadings) {
      buildTOCView(subG, drp);
    }
    e.appendChild(drp);
  }
}

const headings = document.querySelectorAll("article :is(h1, h2, h3, h4, h5, h6)");
const toc = buildTOCGraph(1, 0, headings);
buildTOCView(toc, document.querySelector(".sidenav"));

var dropdown = document.getElementsByClassName("dropdown-btn");
var i;

for (i = 0; i < dropdown.length; i++) {
  dropdown[i].addEventListener("click", function(e) {
    if (e.target.tagName === "A") return;
    this.classList.toggle("active");
    var dropdownContent = this.nextElementSibling;
    if (dropdownContent.style.display === "block") {
      dropdownContent.style.display = "none";
    } else {
      dropdownContent.style.display = "block";
    }
  });
}

// Permalinks
headings.forEach(e => {
  const a = document.createElement("a");
  a.innerText = "#";
  a.href = `#${e.id}`;
  a.className = "permalink";
  e.innerHTML += " "
  e.appendChild(a);
});

// Funny quotes!
const quotes = [
  "You didn't need efficiency, the efficiency was inside you all along.",
  "Perhaps the best image format was the friends we made along the way."
];
document.getElementById("quote").textContent = quotes[Math.floor(Math.random() * quotes.length)];
document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
