name: pages - build and deploy docs

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Jekyll build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./        # Jekyll source at repo root
          destination: ./_site

      # Sphinx build
      - name: Build Sphinx
        run: |
            echo "##[group]Installing Sphinx"
            pip install sphinx
            echo "##[endgroup]"
            echo "Building into sphinx-out"
            sphinx-build -b html implementations/source sphinx-out
            echo "##[group]Post-build"
            sudo mkdir -p _site/implementations && echo Verified existence of _site and _site/implementations
            sudo cp -r sphinx-out/* _site/implementations/ && Copied contents of sphinx-out into _site/implementations
            echo "##[endgroup]"

      # Upload combined site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5